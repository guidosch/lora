<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keller V 2.1 Monitoring</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/locale/de.js"></script>
    <style>
        .backend-loading {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.2);
            color: #1d4ed8;
            font-size: 0.82rem;
            font-weight: 600;
            margin-right: 12px;
            min-height: 40px;
            box-sizing: border-box;
        }

        .backend-loading[hidden] {
            display: none;
        }

        .nav-btn:disabled {
            visibility: hidden;
        }

        .period-label {
            margin: 0 0 10px;
            text-align: center;
            font-weight: 700;
            color: #0f172a;
        }

        .backend-loading .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2563eb;
            animation: backend-loading-pulse 1s ease-in-out infinite;
        }

        @keyframes backend-loading-pulse {
            0%, 100% {
                transform: scale(0.9);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
    </style>
    <script type="text/javascript">
        google.charts.load('current', { 'packages': ['corechart', 'line'] });
        google.charts.setOnLoadCallback(drawChart);

        var query = "";
        var collection = "humidity";
        var activeBackendRequests = 0;
        // 0 = recent data, -1 = one month back, -2 = two months back, ...
        var monthOffset = 0;
        var chartRequestId = 0;
        var chart = null;
        var chartData = null;

        var collectionLabels = {
            humidity: 'Luftfeuchtigkeit',
            temperature: 'Temperatur',
            relayIsPowered: 'Relais Status'
        };

        var collectionColors = {
            humidity: '#2563eb',
            temperature: '#f59e0b',
            relayIsPowered: '#10b981'
        };

        function setBackendLoading(isLoading) {
            $('#backend-loading').prop('hidden', !isLoading);
        }

        function beginBackendRequest() {
            activeBackendRequests += 1;
            setBackendLoading(true);
        }

        function endBackendRequest() {
            activeBackendRequests = Math.max(0, activeBackendRequests - 1);
            if (activeBackendRequests === 0) {
                setBackendLoading(false);
            }
        }

        function getChartOptions() {
            var isCompact = $(window).width() < 720;

            var hAxis = {
                format: 'dd.MM HH:mm',
                gridlines: { count: isCompact ? 4 : 6 },
                slantedText: isCompact,
                slantedTextAngle: isCompact ? 45 : 0,
                textStyle: {
                    fontSize: isCompact ? 10 : 12
                }
            };

            var vAxis = {
                title: collection === 'temperature' ? 'Temperatur (°C)' : collection === 'humidity' ? 'Luftfeuchtigkeit (%)' : 'Relais (0/1)',
                gridlines: { count: 6 },
                textStyle: {
                    fontSize: isCompact ? 10 : 12
                }
            };

            if (collection === 'humidity') {
                vAxis.viewWindow = { min: 40, max: 80 };
                vAxis.ticks = [40, 45, 50, 55, 60, 65, 70, 75, 80];
            } else if (collection === 'temperature') {
                vAxis.viewWindow = { min: 10, max: 30 };
                vAxis.ticks = [10, 15, 20, 25, 30];
            } else {
                vAxis.viewWindow = { min: -0.1, max: 1.1 };
                vAxis.ticks = [0, 1];
            }

            return {
                width: '100%',
                height: isCompact ? 300 : 360,
                legend: { position: 'bottom' },
                chartArea: {
                    left: isCompact ? 35 : 50,
                    top: 10,
                    right: 12,
                    bottom: isCompact ? 25 : 40,
                    width: '100%',
                    height: '80%'
                },
                hAxis: hAxis,
                vAxis: vAxis,
                colors: [collectionColors[collection]],
                pointSize: 3,
                lineWidth: 2,
                animation: { duration: 300, easing: 'inAndOut' }
            };
        }

        function normalizeDateColumn(data) {
            if (data.getNumberOfColumns() < 2) {
                return;
            }

            for (var i = 0; i < data.getNumberOfRows(); i++) {
                var rawDate = data.getValue(i, 0);
                if (rawDate && !(rawDate instanceof Date) && !isNaN(new Date(rawDate).getTime())) {
                    data.setValue(i, 0, new Date(rawDate));
                }
            }
        }

        function formatCollectionValue(metric, value) {
            if (value === null || value === undefined || value === '') {
                return '–';
            }

            if (metric === 'relayIsPowered') {
                return Number(value) > 0 ? 'An' : 'Aus';
            }

            var numericValue = Number(value);
            if (isNaN(numericValue)) {
                return value;
            }

            var decimals = metric === 'temperature' ? 1 : 0;
            var unit = metric === 'temperature' ? '°C' : '%';
            return numericValue.toFixed(decimals) + unit;
        }

        function renderChart() {
            if (!chartData) {
                return;
            }
            if (!chart) {
                chart = new google.visualization.LineChart(document.getElementById('chart_div'));
            }
            chart.draw(chartData, getChartOptions());
        }

        function drawChart() {
            // Only the response of the latest request may update the chart,
            // otherwise fast clicking can show an older month.
            var requestId = ++chartRequestId;
            beginBackendRequest();
            $.ajax({
                url: 'https://europe-west3-kellerv21monitor-275419.cloudfunctions.net/printGraphData',
                crossDomain: true,
                dataType: 'json',
                data: {
                    q: query,
                    collection: collection
                }
            }).done(function (jsonData) {
                if (requestId !== chartRequestId) {
                    return;
                }
                chartData = new google.visualization.DataTable(jsonData);
                normalizeDateColumn(chartData);
                renderChart();
            }).fail(function () {
                if (requestId !== chartRequestId) {
                    return;
                }
                chart = null;
                chartData = null;
                $('#chart_div').html('<span class="loading-indicator">Daten konnten nicht geladen werden.</span>');
            }).always(function () {
                endBackendRequest();
            });
        }

        function loadLatestValues() {
            var metrics = ['humidity', 'temperature', 'relayIsPowered'];
            // Rows are stored by index so the table order stays fixed
            // regardless of which request finishes first.
            var rows = [];
            var completed = 0;

            $.each(metrics, function(index, metric) {
                beginBackendRequest();
                $.ajax({
                    url: 'https://europe-west3-kellerv21monitor-275419.cloudfunctions.net/printGraphData',
                    crossDomain: true,
                    dataType: 'json',
                    data: {
                        q: '',
                        collection: metric
                    }
                }).done(function (json) {
                    var data = new google.visualization.DataTable(json);
                    normalizeDateColumn(data);
                    var rowCount = data.getNumberOfRows();
                    var latestRow = rowCount > 0 ? rowCount - 1 : null;
                    var latestValue = latestRow !== null ? data.getValue(latestRow, 1) : null;
                    var latestDate = latestRow !== null ? data.getValue(latestRow, 0) : null;

                    rows[index] = '<tr>' +
                        '<th scope="row"><span class="metric-pill"><span class="metric-dot" style="background: ' + collectionColors[metric] + ';" aria-hidden="true"></span>' + collectionLabels[metric] + '</span></th>' +
                        '<td>' + formatCollectionValue(metric, latestValue) + '</td>' +
                        '<td>' + (latestDate ? moment(latestDate).format('DD.MM.YYYY HH:mm') : '–') + '</td>' +
                        '</tr>';
                }).fail(function () {
                    rows[index] = '<tr>' +
                        '<th scope="row"><span class="metric-pill"><span class="metric-dot" style="background: ' + collectionColors[metric] + ';" aria-hidden="true"></span>' + collectionLabels[metric] + '</span></th>' +
                        '<td>–</td>' +
                        '<td>–</td>' +
                        '</tr>';
                }).always(function () {
                    endBackendRequest();
                    completed += 1;
                    if (completed === metrics.length) {
                        $('#latest-values tbody').html(rows.join(''));
                    }
                });
            });
        }

        function monthName(offset) {
            return moment().add(offset, 'month').format('MMMM');
        }

        // Derives the query and both button labels from monthOffset.
        function updateNavigation() {
            query = monthOffset === 0 ? '' : moment().add(monthOffset, 'month').format('YYYY-MM-DD');
            $('#period-label').text(moment().add(monthOffset, 'month').format('MMMM YYYY'));
            $('#back').text(monthName(monthOffset - 1));
            $('#forward')
                .text(monthOffset < 0 ? monthName(monthOffset + 1) : '')
                .prop('disabled', monthOffset >= 0);
        }

        function navigateTo(offset) {
            monthOffset = Math.min(0, offset);
            updateNavigation();
            drawChart();
        }

        $(document).ready(function () {
            var resizeTimer = null;
            $(window).resize(function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(renderChart, 150);
            });

            $('#back').click(function () {
                navigateTo(monthOffset - 1);
            });

            $('#forward').click(function () {
                navigateTo(monthOffset + 1);
            });

            $('#recent').click(function () {
                navigateTo(0);
            });

            updateNavigation();

            $('#collection').change(function () {
                collection = $(this).val();
                chart = null;
                chartData = null;
                $('#chart_div').html('<span class="loading-indicator">Lade Daten...</span>');
                drawChart();
            });

            loadLatestValues();
        });
    </script>
</head>

<body>
    <div class="page-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Keller V 2.1</p>
                <h1>Raumklima</h1>
            </div>

            <div class="controls">
                <div id="backend-loading" class="backend-loading" hidden aria-live="polite">
                    <span class="loading-dot" aria-hidden="true"></span>
                    <span>Daten werden geladen...</span>
                </div>
                <label class="select-wrap" for="collection">
                    <span>Messwert</span>
                    <select id="collection">
                        <option value="humidity" selected>Luftfeuchtigkeit</option>
                        <option value="temperature">Temperatur</option>
                        <option value="relayIsPowered">Relais Status</option>
                    </select>
                </label>
            </div>
        </header>

        <section class="panel chart-card">
            <p id="period-label" class="period-label" aria-live="polite"></p>
            <div class="chart-toolbar" aria-label="Monatsnavigation">
                <button id="back" class="nav-btn" type="button" aria-label="Vorheriger Monat"></button>
                <button id="recent" class="secondary-btn" type="button">Aktueller Monat</button>
                <button id="forward" class="nav-btn" type="button" aria-label="Nächster Monat"></button>
            </div>

            <div id="chart_div" class="chart-wrap"><span class="loading-indicator">Lade Daten...</span></div>
        </section>

        <section class="panel table-card">
            <div class="table-header">
                <h2>Letzte Messwerte</h2>
            </div>

            <table id="latest-values">
                <thead>
                    <tr>
                        <th scope="col">Messwert</th>
                        <th scope="col">Aktuell</th>
                        <th scope="col">Zuletzt aktualisiert</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>
</body>

</html>
